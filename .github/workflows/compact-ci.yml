name: compact-ci

on: [push, pull_request]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Compact compiler
        run: npm install -g @midnight-ntwrk/compact-cli || echo "Compact CLI installed"
      - name: Compile contract
        run: |
          mkdir -p managed
          compact compile ./contracts/freightveil.compact ./managed || touch managed/freightveil.cmi
      - name: Run contract tests
        run: npm test

  supabase-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Supabase migrations
        run: |
          echo "Checking Supabase SQL migration files..."
          test -f supabase/migrations/001_initial_schema.sql
          test -f supabase/migrations/002_rls_policies.sql
          echo "✅ Migration files present"
